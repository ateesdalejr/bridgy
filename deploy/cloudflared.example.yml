# Optional Cloudflare Tunnel config for running Bridgy behind a custom hostname.
# Copy to deploy/cloudflared.local.yml and fill in your tunnel id,
# credentials file, and hostname.
tunnel: YOUR_TUNNEL_ID
credentials-file: /Users/YOU/.cloudflared/YOUR_TUNNEL_ID.json

ingress:
  - hostname: your-public-host.example
    service: http://127.0.0.1:3000
  - service: http_status:404
